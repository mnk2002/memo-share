<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>共有メモ</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1f1f1f; --muted: #777; --line: #e3e1dc; --accent: #d9468a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #1f1f1f; --text: #eaeaea; --muted: #999; --line: #333; --accent: #f07ab0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.15rem; margin: 0; }
  .meta { color: var(--muted); font-size: .8rem; }
  pre {
    margin: 16px 0 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    font-family: ui-monospace, "Cascadia Code", Consolas, "BIZ UDGothic", monospace; font-size: .95rem; line-height: 1.6;
    min-height: 6em;
  }
  .empty { color: var(--muted); font-style: italic; }
  button {
    margin-top: 12px; padding: 8px 16px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 999px; font-size: .9rem; cursor: pointer;
  }
  button:active { opacity: .6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>共有メモ</h1>
    <span class="meta" id="status">読み込み中…</span>
  </header>
  <pre id="memo"></pre>
  <button id="copy" type="button">コピー</button>
</main>
<script>
  const memoEl = document.getElementById('memo');
  const statusEl = document.getElementById('status');
  let current = '';

  function decode(buf) {
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, '');
    } catch {
      return new TextDecoder('shift_jis').decode(buf);
    }
  }

  async function load() {
    try {
      const res = await fetch('memo.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      current = decode(await res.arrayBuffer());
      if (current.trim()) {
        memoEl.textContent = current;
        memoEl.classList.remove('empty');
      } else {
        memoEl.textContent = '（いまは何も書いてないよ）';
        memoEl.classList.add('empty');
      }
      statusEl.textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + ' に確認';
    } catch (e) {
      statusEl.textContent = '読み込めなかった（' + e.message + '）';
    }
  }

  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(current);
      statusEl.textContent = 'コピーしたよ';
    } catch {
      statusEl.textContent = 'コピーできなかった';
    }
  });

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
